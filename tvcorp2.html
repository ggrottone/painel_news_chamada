<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel Multimídia - YouTube, RSS & Info</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: Arial, sans-serif; background: #000; color: #fff; }
        
        /* Layout Geral Split (Horizontal) */
        .wrapper { display: flex; width: 100%; height: 100%; }

        /* Lado Esquerdo: Vídeo + Barra Inferior de RSS */
        .main-content { display: flex; flex-direction: column; width: 60%; height: 100%; }

        /* Container para o Player do YouTube */
        .video-container { width: 100%; height: 90vh; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }

        /* Barra de Notícias Redesenhada com Flexbox */
       .barra-noticias {
            height: auto; /* Deixa de ser rígido */
            min-height: 80px;  /* Garante o tamanho das duas linhas de texto */
            max-height: 110px; /* Impede que a barra cresça demais em telas grandes */
            background: #fff;
            color: #777;
            display: flex;
            align-items: stretch;
            justify-content: space-between;
            padding: 12px 30px;
            border-top: 2px solid #222;
        }
        /* Container do Logo na Barra Lateral */
.logo-container {
    margin-top: auto; 
    text-align: center;
    padding-top: 15px;
    border-top: 1px solid #9c9292;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px; /* Compactado */
    flex-shrink: 0; /* Protege o logotipo e o texto contra achatamentos */
}
.logo-container img {
    max-width: 100%;
    max-height: 80px; /* Reduzido de 90px para 80px para dar mais folga vertical */
    height: auto;
    object-fit: contain;
    border-radius: 8px;
}
.logo-texto {
    font-size: 1.1rem; /* Reduzido sutilmente de 1.2rem para 1.1rem */
    font-weight: bold;
    letter-spacing: 3px;
    color: #3b82f6;
    text-transform: uppercase;
}
        /* Mantém o alinhamento das notícias perfeitamente centralizado */
        .espaco-compensador {
            width: 30px;
        }

        .noticia-texto {
            flex: 1;
            font-size: 1.0rem;
            text-align: center;
            padding: 0 20px;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Widget do Relógio no Canto Direito */
        .relogio-container {
            width: 150px;
            text-align: right;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .relogio-hora {
            font-size: 1.4rem;
            font-weight: bold;
            color: #3b82f6;
            font-family: 'Courier New', Courier, monospace; /* Evita flutuações de tamanho ao mudar números */
        }

        .relogio-fuso {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 2px;
        }

        /* Barra Lateral Direita (Widgets) */
        .sidebar {
            width: 40%;
            height: 100%;
            background: #b8afaf;
            border-left: 2px solid #222;
            display: flex;
            flex-direction: column;
            padding: 20px 15px;
            gap: 15px; /* Reduzido o espaço para aproximar os elementos */
            overflow-y: auto; /* Ativa a rolagem de segurança se a tela for muito curta */
            scrollbar-width: none; /* Oculta a barra de rolagem no Firefox */
        }
        .sidebar::-webkit-scrollbar {
            display: none; /* Oculta a barra de rolagem no Chrome, Safari e Edge */
        }
        .widget {
            background: #f8f5f5;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px 10px; /* Compactado ligeiramente */
            text-align: center;
            flex-shrink: 0; /* Impede o navegador de amassar ou deformar o widget */
            color: #333;
        }
        .widget h3 {
            font-size: 1.7rem; /* Ajustado */
            text-transform: uppercase;
            color: #666;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .widget-value {
            font-size: 3.0rem; /* Ajustado para melhor encaixe lateral */
            font-weight: bold;
            color: #3b82f6;
        }
        .widget-sub {
            font-size: 1.9rem;
            color: #777;
            margin-top: 8px;
        }

        /* Estilos do Painel de Senhas */
        .senha-atual-box {
            background: #1e293b;
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .senha-destaque {
            font-size: 4.2rem;
            font-weight: 800;
            color: #ffffff;
            line-height: 1;
        }
        .mesa-destaque {
            font-size: 4.2rem;
            font-weight: 700;
            color: #38bdf8;
            margin-top: 4px;
        }
        .lista-senhas-anteriores {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .item-senha-anterior {
            display: flex;
            justify-content: space-between;
            background: #e2e8f0;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 1.8rem;
            font-weight: bold;
            color: #334155;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="main-content">
            <div class="video-container">
                <div id="youtube-player"></div>
            </div>
            
            <div class="barra-noticias">
                <div class="espaco-compensador"></div> 
                <div class="noticia-texto" id="barraNoticias">
                    Carregando notícias...
                </div>
                
                <div class="relogio-container">
                    <div class="relogio-hora" id="relogio">00:00:00</div>
                    <div class="relogio-fuso">GMT-3</div>
                </div>
            </div>
        </div>

        <div class="sidebar">

        

            <div class="widget">
                <h3>Tempo em Santos</h3>
                <div class="widget-value" id="temp-santos">--°C</div>
                <div class="widget-sub" id="condicao-santos">Obtendo dados...</div>
                <div class="widget-sub" id="minmax-santos" style="font-size: 0.8rem; margin-top: 5px;">-- / --</div>
            </div>

            <!-- NOVO WIDGET: SENHAS E MESAS -->
            <div class="widget" id="widget-senhas">
                <h3>Chamada de Senhas</h3>
                <div class="senha-atual-box">
                    <div class="senha-destaque" id="senha-atual-num">---</div>
                    <div class="mesa-destaque" id="senha-atual-mesa">MESA --</div>
                </div>
                <div class="widget-sub" style="font-size: 1.2rem; margin-bottom: 6px; font-weight: bold;">ÚLTIMAS CHAMADAS</div>
                <ul class="lista-senhas-anteriores" id="lista-senhas">
                    <!-- Senhas anteriores inseridas via JS -->
                </ul>
            </div>

            <div class="logo-container">
                <img src="./static/images/logo1.png" alt="Logotipo"> 
                <div class="logo-texto">INFORMA</div>
            </div>
        </div>
    </div>

    <script>
        function tocarBip() {
    try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        // Se o contexto estiver suspenso (bloqueio do navegador), tenta reativar
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';         // Onda senoidal (tom limpo de bip)
        osc.frequency.value = 880; // Frequência em Hz (Nota Lá / tom padrão)

        const agora = audioCtx.currentTime;
        const duracao = 1.0;       // Duração exata de 1 segundo

        // Volume MÁXIMO (1.0)
        gain.gain.setValueAtTime(1.0, agora);
        
        // Suaviza levemente o final nos últimos 0.05s para evitar "estalo" nos alto-falantes
        gain.gain.setValueAtTime(1.0, agora + duracao - 0.05);
        gain.gain.exponentialRampToValueAtTime(0.0001, agora + duracao);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(agora);
        osc.stop(agora + duracao);
    } catch (e) {
        console.warn("Não foi possível reproduzir o áudio:", e);
    }
}
        // ==========================================
        // 0. RELÓGIO EM TEMPO REAL (GMT-3)
        // ==========================================
        function atualizarRelogio() {
            const agora = new Date();
            
            const formatador = new Intl.DateTimeFormat('pt-BR', {
                timeZone: 'America/Sao_Paulo',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });
            
            document.getElementById('relogio').innerText = formatador.format(agora);
        }
        
        setInterval(atualizarRelogio, 1000);
        atualizarRelogio(); 


        // ====================================================================
        // 1. CONFIGURAÇÃO DE CAPTURA AUTOMÁTICA DA LIVE DO YOUTUBE
        // ====================================================================
        const API_KEY = 'AIzaSyC62yTSO7Zg4v7P2U1lIhrGQ67seb-xwxk'; // Sua chave de API inserida[cite: 1]
        const CHANNEL_ID = 'UCpDsvyyPUzoQPsjYWk1AIqg'; // Substitua pelo ID do seu canal[cite: 1]
        const VIDEO_BACKUP = 'T8Jz3UVqYPg'; // Seu vídeo padrão caso não esteja ao vivo[cite: 1]

        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                playerVars: {
                    'listType': 'playlist',
                    'list': 'PLMMimlbsy2Fa1nMpwYvVyP1k0qv25bcMj',
                    'autoplay': 1,
                    'loop': 1,
                    'controls': 1,
                    'rel': 0,
                    'mute': 1
                },
                events: {
                    'onReady': onPlayerReady
                }
            });
        }

        function onPlayerReady(event) {
            event.target.playVideo();
        }


        // ==========================================
        // 2. FEED RSS DE NOTÍCIAS
        // ==========================================
        const rssUrl = encodeURIComponent('https://g1.globo.com/rss/g1/tecnologia/');
        const apiRss = `https://api.rss2json.com/v1/api.json?rss_url=${rssUrl}`;
        let noticias = [];
        let indiceNoticiaAtual = 0;
        const barra = document.getElementById('barraNoticias');

        fetch(apiRss)
            .then(res => res.json())
            .then(data => {
                if(data.status === 'ok') {
                    noticias = data.items.map(item => `📢 ${item.title}`);
                    mostrarProximaNoticia();
                    setInterval(mostrarProximaNoticia, 15000);
                } else {
                    barra.innerText = "Erro no feed RSS.";
                }
            })
            .catch(() => barra.innerText = "Erro ao conectar ao RSS.");

        function mostrarProximaNoticia() {
            if (noticias.length > 0) {
                barra.innerText = noticias[indiceNoticiaAtual];
                indiceNoticiaAtual = (indiceNoticiaAtual + 1) % noticias.length;
            }
        }


        // ==========================================
        // 3. COTAÇÃO DO DÓLAR E EURO
        // ==========================================
        function atualizarDolar() {
            const apiPrincipal = "https://economia.awesomeapi.com.br/json/last/USD-BRL";
            
            function exibirValor(valor) {
                const cotacao = parseFloat(valor).toFixed(2);
                document.getElementById('valor-dolar').innerText = `R$ ${cotacao}`;
            }

            fetch(apiPrincipal)
                .then(res => {
                    if (!res.ok) throw new Error("Falha na API Principal");
                    return res.json();
                })
                .then(data => {
                    if (data && data.USDBRL) {
                        exibirValor(data.USDBRL.bid);
                    } else {
                        throw new Error("Formato inválido");
                    }
                })
                .catch(erro => {
                    fetch("https://open.er-api.com/v6/latest/USD")
                        .then(res => {
                            if (!res.ok) throw new Error("Falha na API de contingência");
                            return res.json();
                        })
                        .then(data => {
                            if (data && data.rates && data.rates.BRL) {
                                exibirValor(data.rates.BRL);
                            }
                        })
                        .catch(() => {
                            document.getElementById('valor-dolar').innerText = "R$ 5,09*";
                        });
                });
        }

        function atualizarEuro() {
            const apiPrincipal = "https://economia.awesomeapi.com.br/json/last/EUR-BRL";
            
            function exibirValor(valor) {
                const cotacao = parseFloat(valor).toFixed(2);
                document.getElementById('valor-euro').innerText = `R$ ${cotacao}`;
            }

            fetch(apiPrincipal)
                .then(res => {
                    if (!res.ok) throw new Error("Falha na API Principal");
                    return res.json();
                })
                .then(data => {
                    if (data && data.EURBRL) {
                        exibirValor(data.EURBRL.bid);
                    } else {
                        throw new Error("Formato inválido");
                    }
                })
                .catch(erro => {
                    fetch("https://open.er-api.com/v6/latest/EUR")
                        .then(res => {
                            if (!res.ok) throw new Error("Falha na API de contingência");
                            return res.json();
                        })
                        .then(data => {
                            if (data && data.rates && data.rates.BRL) {
                                exibirValor(data.rates.BRL);
                            }
                        })
                        .catch(() => {
                            document.getElementById('valor-euro').innerText = "R$ 5,09*";
                        });
                });
        }


        // ==========================================
        // 4. PREVISÃO DO TEMPO SANTOS
        // ==========================================
        function atualizarClima() {
            const urlClima = "https://api.open-meteo.com/v1/forecast?latitude=-23.9608&longitude=-46.3336&current_weather=true&daily=temperature_2m_max,temperature_2m_min&timezone=America/Sao_Paulo";
            
            fetch(urlClima)
                .then(res => res.json())
                .then(data => {
                    const tempAtual = Math.round(data.current_weather.temperature);
                    const tempMax = Math.round(data.daily.temperature_2m_max[0]);
                    const tempMin = Math.round(data.daily.temperature_2m_min[0]);
                    const weatherCode = data.current_weather.weathercode;

                    let condicao = "Limpo";
                    if (weatherCode >= 1 && weatherCode <= 3) condicao = "Parcialmente Nublado";
                    else if (weatherCode >= 45 && weatherCode <= 48) condicao = "Névoa / Nevoeiro";
                    else if (weatherCode >= 51 && weatherCode <= 67) condicao = "Chuva Leve";
                    else if (weatherCode >= 80 && weatherCode <= 82) condicao = "Pancadas de Chuva";
                    else if (weatherCode >= 95) condicao = "Tempestade";

                    document.getElementById('temp-santos').innerText = `${tempAtual}°C`;
                    document.getElementById('condicao-santos').innerText = condicao;
                    document.getElementById('minmax-santos').innerText = `Min: ${tempMin}°C / Max: ${tempMax}°C`;
                })
                .catch(() => {
                    document.getElementById('condicao-santos').innerText = "Erro ao obter clima";
                });
        }


        // ==========================================
        // 5. LEITURA DO ARQUIVO CHAMADAS.TXT (SENHAS)
        // ==========================================
        function atualizarSenhasAPI_VELHO() {
            fetch('http://sistema.holhosgrottone.com.br:8000/chamadas')
                .then(res => {
                    if (!res.ok) throw new Error("Erro na comunicação com a API");
                    return res.json();
                })
                .then(dados => {
                    if (!dados.sucesso) return;

                    // Atualiza a Senha Atual
                    if (dados.atual) {
                        document.getElementById('senha-atual-num').innerText = dados.atual.senha;
                        document.getElementById('senha-atual-mesa').innerText = dados.atual.mesa;
                    } else {
                        document.getElementById('senha-atual-num').innerText = "---";
                        document.getElementById('senha-atual-mesa').innerText = "MESA --";
                    }

                    // Atualiza a Lista de Senhas Anteriores
                    const listaUl = document.getElementById('lista-senhas');
                    listaUl.innerHTML = '';

                    if (dados.historico && dados.historico.length > 0) {
                        dados.historico.forEach(item => {
                            const li = document.createElement('li');
                            li.className = 'item-senha-anterior';
                            li.innerHTML = `<span>${item.senha}</span><span>${item.mesa}</span>`;
                            listaUl.appendChild(li);
                        });
                    }
                })
                .catch(err => console.warn("Aguardando atualizações da API...", err));
        }
let ultimaSenhaExibida = null;

function atualizarSenhasAPI() {
    fetch('http://sistema.holhosgrottone.com.br:8000/chamadas')
        .then(res => {
            if (!res.ok) throw new Error("Status HTTP: " + res.status);
            return res.json();
        })
        .then(dados => {
            if (!dados || !dados.sucesso) return;

            const elSenha = document.getElementById('senha-atual-num');
            const elMesa = document.getElementById('senha-atual-mesa');

            if (dados.atual) {
                const novaSenha = dados.atual.senha;
                const novaMesa = dados.atual.mesa;

                // 🔔 Se for a PRIMEIRA LEITURA após abrir a página, apenas armazena.
                // Se for uma SENHA DIFERENTE da anterior, toca o BIP!
                if (ultimaSenhaExibida !== null && ultimaSenhaExibida !== novaSenha) {
                    tocarBip();
                }

                // Atualiza a variável de controle
                ultimaSenhaExibida = novaSenha;

                if (elSenha) elSenha.innerText = novaSenha;
                if (elMesa) elMesa.innerText = novaMesa;
            } else {
                if (elSenha) elSenha.innerText = "---";
                if (elMesa) elMesa.innerText = "MESA --";
            }

            // Atualiza o histórico de 4 senhas anteriores
            const listaUl = document.getElementById('lista-senhas');
            if (listaUl) {
                listaUl.innerHTML = '';
                if (dados.historico && dados.historico.length > 0) {
                    dados.historico.forEach(item => {
                        const li = document.createElement('li');
                        li.className = 'item-senha-anterior';
                        li.innerHTML = `<span>${item.senha}</span><span>${item.mesa}</span>`;
                        listaUl.appendChild(li);
                    });
                }
            }
        })
        .catch(err => console.warn("Erro ao buscar senhas:", err));
}

        // Inicialização de todas as funções ao carregar a página
        window.onload = function() {
            atualizarDolar();
            atualizarEuro();
            atualizarClima();
            atualizarSenhasAPI();
            
            // Intervalos de atualização
            //setInterval(atualizarDolar, 600000);
            //setInterval(atualizarEuro, 600000);
            setInterval(atualizarClima, 600000);
            setInterval(atualizarSenhasAPI, 2000); // Consulta o chamadas.txt a cada 2 segundos
        };
    </script>
